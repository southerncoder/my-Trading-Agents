# =====================================================================================
# Trading Agents - Consolidated Docker Compose Configuration
# =====================================================================================

name: my-Trading-Agents

services:
  # ============================================================================
  # DATABASE LAYER
  # ============================================================================

  # PostgreSQL Database for Structured Data and Agent Memory
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: trading-agents-postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-38420}:5432"
    environment:
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_agents}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Redis Cache for Multi-Level Caching System
  redis:
    image: redis:8.10-alpine
    container_name: trading-agents-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-38421}:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Neo4j Database for Knowledge Graph Storage
  neo4j:
    image: neo4j:5.26.33
    container_name: trading-agents-neo4j
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-38422}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-38423}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    secrets:
      - neo4j_user
      - neo4j_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # AI/MEMORY LAYER
  # ============================================================================

  # Zep Graphiti Memory Service
  zep-graphiti:
    image: zepai/graphiti:0.31.2
    container_name: trading-agents-zep-graphiti
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GRAPHITI_PORT:-38410}:8000"
    environment:
      - NEO4J_URI=bolt://trading-agents-neo4j:7687
      - neo4j_uri=bolt://trading-agents-neo4j:7687
      - neo4j_user=${NEO4J_USER:-neo4j}
      - neo4j_password=${NEO4J_PASSWORD}
      # Local Ollama through its OpenAI-compatible API. graphiti 0.31.2 only lets the server override the
      # LLM model; its embedder uses the default model name `text-embedding-3-small`, so an Ollama alias of
      # that name points at ${EMBEDDING_MODEL} (see tools/setup-ollama-models.ps1). Vectors are cut to 1024 dims.
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}/v1
      - MODEL_NAME=${GRAPHITI_LLM_MODEL:-qwen3.5:9b}
      - EMBEDDING_MODEL_NAME=text-embedding-3-small
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # DATA SERVICES LAYER
  # ============================================================================

  # Unified News Aggregator Service
  news-aggregator:
    build:
      context: ./services/news-aggregator-service
      dockerfile: Dockerfile
    image: news-aggregator-service:latest
    container_name: trading-news-aggregator
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3004
      - NEWS_API_KEY_FILE=/run/secrets/news_api_key
      - BRAVE_NEWS_API_KEY_FILE=/run/secrets/brave_news_api_key
      - GOOGLE_API_KEY_FILE=/run/secrets/google_api_key
    secrets:
      - news_api_key
      - brave_news_api_key
      - google_api_key
      - tavily_api_key
    ports:
      - "127.0.0.1:${NEWS_PORT:-38404}:3004"
    networks:
      - my-Trading-Agents

  # Government Data Service
  government-data:
    build:
      context: ./services/government-data-service
      dockerfile: Dockerfile
    image: government-data-service:latest
    container_name: trading-government-data
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3005
    ports:
      - "127.0.0.1:${GOVERNMENT_DATA_PORT:-38405}:3005"
    networks:
      - my-Trading-Agents

  # Finance Aggregator Service
  finance-aggregator:
    build:
      context: ./services/finance-aggregator-service
      dockerfile: Dockerfile
    image: finance-aggregator-service:latest
    container_name: trading-finance-aggregator
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3006
    ports:
      - "127.0.0.1:${FINANCE_PORT:-38406}:3006"
    networks:
      - my-Trading-Agents

  # Yahoo Finance Service (market data / quotes for trading-agents)
  yahoo-finance:
    build:
      context: ./services/yahoo-finance-service
      dockerfile: Dockerfile
    image: yahoo-finance-service:latest
    container_name: trading-yahoo-finance
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3002
    ports:
      - "127.0.0.1:${YAHOO_FINANCE_PORT:-38402}:3002"
    networks:
      - my-Trading-Agents

  # Social Sentiment Service
  social-sentiment:
    build:
      context: ./services/social-sentiment-service
      dockerfile: Dockerfile
    image: social-sentiment-service:latest
    container_name: trading-social-sentiment
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3007
      - REDDIT_CLIENT_ID_FILE=/run/secrets/reddit_client_id
      - REDDIT_CLIENT_SECRET_FILE=/run/secrets/reddit_client_secret
      - REDDIT_USERNAME_FILE=/run/secrets/reddit_username
      - REDDIT_PASSWORD_FILE=/run/secrets/reddit_password
      - REDDIT_USER_AGENT_FILE=/run/secrets/reddit_user_agent
      - TWITTER_BEARER_TOKEN_FILE=/run/secrets/twitter_bearer_token
    secrets:
      - sentisense_api_key
      - reddit_client_id
      - reddit_client_secret
      - reddit_username
      - reddit_password
      - reddit_user_agent
      - twitter_bearer_token
    ports:
      - "127.0.0.1:${SOCIAL_PORT:-38407}:3007"
    networks:
      - my-Trading-Agents

  # ============================================================================
  # APPLICATION LAYER
  # ============================================================================

  # Main Trading Agents Service
  trading-agents:
    build:
      context: ./services/trading-agents
      dockerfile: Dockerfile
    container_name: trading-agents-main
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - TRADING_AGENTS_WEB_MODE=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-trading_agents}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # LLM: local Ollama (default port) on the host
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_BACKEND_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}/v1
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-qwen3.5:9b}
      - QUICK_THINK_LLM=${QUICK_THINK_LLM:-qwen3.5:9b}
      - DEEP_THINK_LLM=${DEEP_THINK_LLM:-qwen3.5:9b}
      # Per-agent models (env wins over the LM Studio defaults in src/agents/configs/*.json)
      - MARKET_ANALYST_LLM_MODEL=${MARKET_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - SOCIAL_ANALYST_LLM_MODEL=${SOCIAL_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - NEWS_ANALYST_LLM_MODEL=${NEWS_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - FUNDAMENTALS_ANALYST_LLM_MODEL=${FUNDAMENTALS_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - BULL_RESEARCHER_LLM_MODEL=${BULL_RESEARCHER_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - BEAR_RESEARCHER_LLM_MODEL=${BEAR_RESEARCHER_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - RESEARCH_MANAGER_LLM_MODEL=${RESEARCH_MANAGER_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - RISKY_ANALYST_LLM_MODEL=${RISKY_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - SAFE_ANALYST_LLM_MODEL=${SAFE_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - NEUTRAL_ANALYST_LLM_MODEL=${NEUTRAL_ANALYST_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - PORTFOLIO_MANAGER_LLM_MODEL=${PORTFOLIO_MANAGER_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - TRADER_LLM_MODEL=${TRADER_LLM_MODEL:-${DEFAULT_LLM_MODEL:-qwen3.5:9b}}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:4b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-16384}
      - OLLAMA_THINK=${OLLAMA_THINK:-false}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-300000}
      # Data services (compose-internal ports)
      - GOVERNMENT_DATA_URL=http://government-data:3005
      - NEWS_AGGREGATOR_URL=http://news-aggregator:3004
      - YAHOO_FINANCE_URL=http://yahoo-finance:3002
      - REDDIT_SERVICE_URL=http://social-sentiment:3007
      - ZEP_GRAPHITI_URL=http://zep-graphiti:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgresql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      zep-graphiti:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./results:/app/results
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Trading agents service healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # WEB SERVICES LAYER
  # ============================================================================

  # Web API Backend
  web-api:
    build:
      context: ./services/web-api
      dockerfile: Dockerfile
    container_name: trading-agents-web-api
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=3001
      - CORS_ORIGIN=http://localhost:${FRONTEND_PORT:-38400}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-38400}
      - TRADING_AGENTS_SERVICE_PATH=/app/trading-agents
      - ANALYSIS_TIMEOUT=300000
      - MAX_CONCURRENT_ANALYSES=3
      - ENABLE_ANALYSIS_CACHING=true
      - ANALYSIS_CACHE_TIMEOUT=300000
    depends_on:
      trading-agents:
        condition: service_healthy
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./services/trading-agents:/app/trading-agents:ro
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:${WEB_API_PORT:-38401}:3001"
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Web Frontend
  web-frontend:
    build:
      context: ./services/web-frontend
      dockerfile: Dockerfile
    container_name: trading-agents-web-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-38400}:80"
    depends_on:
      web-api:
        condition: service_healthy
    networks:
      - my-Trading-Agents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  # Internal network for Reddit service
  reddit-network:
    driver: bridge
    internal: true

  # Main trading network with external access
  my-Trading-Agents:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

# ============================================================================
# SECRETS
# ============================================================================

secrets:
  # Database Secrets
  postgres_db:
    file: ./docker/secrets/postgres_db.txt
  postgres_user:
    file: ./docker/secrets/postgres_user.txt
  postgres_password:
    file: ./docker/secrets/postgres_password.txt
  neo4j_user:
    file: ./docker/secrets/neo4j_user.txt
  neo4j_password:
    file: ./docker/secrets/neo4j_password.txt
  
  # AI Provider Secrets
  openai_api_key:
    file: ./docker/secrets/openai_api_key.txt
  
  # News API Secrets
  news_api_key:
    file: ./docker/secrets/news_api_key.txt
  brave_news_api_key:
    file: ./docker/secrets/brave_news_api_key.txt
  tavily_api_key:
    file: ./docker/secrets/tavily_api_key.txt
  google_api_key:
    file: ./docker/secrets/google_api_key.txt
  
  # Social Media API Secrets
  sentisense_api_key:
    file: ./docker/secrets/sentisense_api_key.txt
  reddit_client_id:
    file: ./docker/secrets/reddit_client_id.txt
  reddit_client_secret:
    file: ./docker/secrets/reddit_client_secret.txt
  reddit_username:
    file: ./docker/secrets/reddit_username.txt
  reddit_password:
    file: ./docker/secrets/reddit_password.txt
  reddit_user_agent:
    file: ./docker/secrets/reddit_user_agent.txt
  twitter_bearer_token:
    file: ./docker/secrets/twitter_bearer_token.txt
